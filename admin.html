<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hospital Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #333;
        }

        header {
            background: #1976d2;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 25px;
        }

        .logout-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c62828;
        }

        .container {
            padding: 25px;
        }

        .dashboard-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            text-align: center;
        }

        .card h3 {
            margin: 0 0 10px;
            color: #555;
        }

        .card p {
            font-size: 30px;
            font-weight: bold;
            color: #1976d2;
            margin: 0;
        }

        .section {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }

        .section-header h2 {
            margin: 0;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        #searchInput {
            padding: 10px;
            width: 250px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .refresh-btn {
            background: #1976d2;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
        }

        .refresh-btn:hover {
            background: #125ca3;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1200px;
        }

        th {
            background: #1976d2;
            color: white;
            padding: 12px;
            text-align: left;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .status {
            padding: 6px 10px;
            border-radius: 5px;
            border: none;
            font-weight: bold;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .confirmed {
            background: #d4edda;
            color: #155724;
        }

        .completed {
            background: #cce5ff;
            color: #004085;
        }

        .cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .edit-btn {
            background: #ff9800;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 5px;
        }

        .delete-btn {
            background: #e53935;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #e68900;
        }

        .delete-btn:hover {
            background: #c62828;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        @media (max-width: 800px) {
            .dashboard-cards {
                grid-template-columns: 1fr;
            }

            .section-header {
                flex-direction: column;
                align-items: stretch;
            }

            #searchInput {
                width: 100%;
            }

            .controls {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>🏥 Hospital Admin Dashboard</h1>

    <button class="logout-btn" onclick="logout()">
        🚪 Logout
    </button>
</header>

<div class="container">

    <div class="dashboard-cards">

        <div class="card">
            <h3>Total Appointments</h3>
            <p id="totalAppointments">0</p>
        </div>

        <div class="card">
            <h3>Today's Appointments</h3>
            <p id="todayAppointments">0</p>
        </div>

        <div class="card">
            <h3>Latest Appointment ID</h3>
            <p id="latestAppointment">-</p>
        </div>

    </div>

    <div class="section">

        <div class="section-header">

            <h2>All Appointments</h2>

            <div class="controls">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search appointments..."
                    oninput="searchAppointments()"
                >

                <button
                    class="refresh-btn"
                    onclick="loadAppointments()"
                >
                    🔄 Refresh
                </button>

            </div>

        </div>

        <div id="errorMessage" class="message error"></div>
        <div id="successMessage" class="message success"></div>

        <div class="table-container">

            <table>

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Patient Name</th>
                        <th>Age</th>
                        <th>Hospital</th>
                        <th>Specialist</th>
                        <th>Date</th>
                        <th>Time Slot</th>
                        <th>Mobile</th>
                        <th>Email</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="appointmentTableBody">

                    <tr>
                        <td colspan="11" class="no-data">
                            Loading appointments...
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>


<script>

const API_URL = "http://localhost:3000/api/appointments";

let appointments = [];


/* ================================
   LOAD APPOINTMENTS
================================ */

async function loadAppointments() {

    const tableBody =
        document.getElementById("appointmentTableBody");

    const errorMessage =
        document.getElementById("errorMessage");

    errorMessage.style.display = "none";

    tableBody.innerHTML = `
        <tr>
            <td colspan="11" class="no-data">
                Loading appointments...
            </td>
        </tr>
    `;

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error(
                "Backend returned status " + response.status
            );
        }

        appointments = await response.json();

        console.log("Appointments loaded:", appointments);

        updateDashboard();

        displayAppointments(appointments);

    } catch (error) {

        console.error("Error loading appointments:", error);

        tableBody.innerHTML = `
            <tr>
                <td colspan="11" class="no-data">
                    Unable to load appointments.
                </td>
            </tr>
        `;

        errorMessage.textContent =
            "❌ Unable to load appointments. Make sure the backend server is running on port 3000.";

        errorMessage.style.display = "block";
    }
}


/* ================================
   UPDATE DASHBOARD CARDS
================================ */

function updateDashboard() {

    document.getElementById("totalAppointments").textContent =
        appointments.length;

    const today =
        new Date().toISOString().split("T")[0];

    const todayCount =
        appointments.filter(
            appointment =>
                appointment.appointmentDate === today
        ).length;

    document.getElementById("todayAppointments").textContent =
        todayCount;

    if (appointments.length > 0) {

        const latestId =
            Math.max(
                ...appointments.map(
                    appointment => Number(appointment.id)
                )
            );

        document.getElementById("latestAppointment").textContent =
            latestId;

    } else {

        document.getElementById("latestAppointment").textContent =
            "-";
    }
}


/* ================================
   DISPLAY APPOINTMENTS
================================ */

function displayAppointments(data) {

    const tableBody =
        document.getElementById("appointmentTableBody");

    if (!data || data.length === 0) {

        tableBody.innerHTML = `
            <tr>
                <td colspan="11" class="no-data">
                    No appointments found.
                </td>
            </tr>
        `;

        return;
    }


    tableBody.innerHTML = data.map(appointment => {

        const status =
            appointment.status || "Pending";

        const statusClass =
            status.toLowerCase();

        return `

            <tr>

                <td>${appointment.id}</td>

                <td>${appointment.patientName}</td>

                <td>${appointment.patientAge}</td>

                <td>${appointment.hospital}</td>

                <td>${appointment.specialist}</td>

                <td>${appointment.appointmentDate}</td>

                <td>${appointment.timeSlot}</td>

                <td>${appointment.mobileNumber}</td>

                <td>${appointment.email || "-"}</td>

                <td>

                    <select
                        class="status ${statusClass}"
                        onchange="changeStatus(${appointment.id}, this.value)"
                    >

                        <option value="Pending"
                            ${status === "Pending" ? "selected" : ""}>
                            Pending
                        </option>

                        <option value="Confirmed"
                            ${status === "Confirmed" ? "selected" : ""}>
                            Confirmed
                        </option>

                        <option value="Completed"
                            ${status === "Completed" ? "selected" : ""}>
                            Completed
                        </option>

                        <option value="Cancelled"
                            ${status === "Cancelled" ? "selected" : ""}>
                            Cancelled
                        </option>

                    </select>

                </td>

                <td>

                    <button
                        class="edit-btn"
                        onclick="editAppointment(${appointment.id})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteAppointment(${appointment.id})"
                    >
                        Delete
                    </button>

                </td>

            </tr>

        `;

    }).join("");
}


/* ================================
   CHANGE STATUS
================================ */

async function changeStatus(id, status) {

    try {

        const response = await fetch(
            `${API_URL}/${id}/status`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    status: status
                })
            }
        );

        const result = await response.json();

        if (!response.ok || !result.success) {
            throw new Error(
                result.message || "Failed to update status"
            );
        }

        showSuccess(
            `Appointment ${id} status changed to ${status}.`
        );

        loadAppointments();

    } catch (error) {

        console.error(error);

        showError(
            "Failed to update appointment status."
        );

    }
}


/* ================================
   SEARCH
================================ */

function searchAppointments() {

    const search =
        document
            .getElementById("searchInput")
            .value
            .toLowerCase()
            .trim();

    if (!search) {

        displayAppointments(appointments);

        return;
    }

    const filtered =
        appointments.filter(appointment => {

            return (

                String(appointment.id)
                    .toLowerCase()
                    .includes(search)

                ||

                String(appointment.patientName)
                    .toLowerCase()
                    .includes(search)

                ||

                String(appointment.hospital)
                    .toLowerCase()
                    .includes(search)

                ||

                String(appointment.specialist)
                    .toLowerCase()
                    .includes(search)

                ||

                String(appointment.mobileNumber)
                    .toLowerCase()
                    .includes(search)

                ||

                String(appointment.status || "Pending")
                    .toLowerCase()
                    .includes(search)

            );

        });

    displayAppointments(filtered);
}


/* ================================
   DELETE
================================ */

async function deleteAppointment(id) {

    const confirmDelete =
        confirm(
            `Are you sure you want to delete appointment ${id}?`
        );

    if (!confirmDelete) {
        return;
    }

    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "DELETE"
                }
            );

        const result =
            await response.json();

        if (!response.ok || !result.success) {

            throw new Error(
                result.message ||
                "Failed to delete appointment"
            );
        }

        showSuccess(
            `Appointment ${id} deleted successfully.`
        );

        loadAppointments();

    } catch (error) {

        console.error(error);

        showError(
            "Failed to delete appointment."
        );
    }
}


/* ================================
   EDIT
================================ */

function editAppointment(id) {

    const appointment =
        appointments.find(
            item => Number(item.id) === Number(id)
        );

    if (!appointment) {
        alert("Appointment not found.");
        return;
    }

    const patientName =
        prompt(
            "Patient Name:",
            appointment.patientName
        );

    if (patientName === null) return;


    const patientAge =
        prompt(
            "Patient Age:",
            appointment.patientAge
        );

    if (patientAge === null) return;


    const hospital =
        prompt(
            "Hospital:",
            appointment.hospital
        );

    if (hospital === null) return;


    const specialist =
        prompt(
            "Specialist:",
            appointment.specialist
        );

    if (specialist === null) return;


    const appointmentDate =
        prompt(
            "Appointment Date:",
            appointment.appointmentDate
        );

    if (appointmentDate === null) return;


    const timeSlot =
        prompt(
            "Time Slot:",
            appointment.timeSlot
        );

    if (timeSlot === null) return;


    const mobileNumber =
        prompt(
            "Mobile Number:",
            appointment.mobileNumber
        );

    if (mobileNumber === null) return;


    const email =
        prompt(
            "Email:",
            appointment.email || ""
        );

    if (email === null) return;


    updateAppointment(
        id,
        {
            patientName,
            patientAge,
            hospital,
            specialist,
            appointmentDate,
            timeSlot,
            mobileNumber,
            email
        }
    );
}


/* ================================
   UPDATE APPOINTMENT
================================ */

async function updateAppointment(id, data) {

    try {

        const response =
            await fetch(
                `${API_URL}/${id}`,
                {
                    method: "PUT",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)
                }
            );

        const result =
            await response.json();

        if (!response.ok || !result.success) {

            throw new Error(
                result.message ||
                "Failed to update appointment"
            );
        }

        showSuccess(
            `Appointment ${id} updated successfully.`
        );

        loadAppointments();

    } catch (error) {

        console.error(error);

        showError(
            "Failed to update appointment."
        );
    }
}


/* ================================
   MESSAGES
================================ */

function showSuccess(message) {

    const box =
        document.getElementById("successMessage");

    box.textContent = "✅ " + message;

    box.style.display = "block";

    setTimeout(() => {
        box.style.display = "none";
    }, 3000);
}


function showError(message) {

    const box =
        document.getElementById("errorMessage");

    box.textContent = "❌ " + message;

    box.style.display = "block";
}


/* ================================
   LOGOUT
================================ */

function logout() {

    window.location.href = "login.html";
}


/* ================================
   START
================================ */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        loadAppointments();

    }
);

</script>

</body>
</html>
