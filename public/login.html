<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Hospital</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #00bfae, #007f73);
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .logo {
            text-align: center;
            font-size: 50px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #00bfae;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #00bfae;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #009f92;
        }

        #error {
            display: none;
            margin-top: 15px;
            padding: 10px;
            background: #ffe5e5;
            color: #c62828;
            border-radius: 6px;
            text-align: center;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #00a99a;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">🏥</div>

        <h1>Admin Login</h1>

        <p class="subtitle">
            Hospital Appointment System
        </p>

        <form id="loginForm">

            <label for="username">Username</label>

            <input
                type="text"
                id="username"
                placeholder="Enter username"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div id="error">
            Invalid username or password.
        </div>

        <div class="back">
            <a href="index.html">← Back to Hospital Website</a>
        </div>

    </div>


    <script>

        document.getElementById("loginForm").addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document.getElementById("username").value;

            const password =
                document.getElementById("password").value;

            const error =
                document.getElementById("error");


            // Admin login details
            const correctUsername = "admin";
            const correctPassword = "admin123";


            if (
                username === correctUsername &&
                password === correctPassword
            ) {

                // Save login status
                sessionStorage.setItem("adminLoggedIn", "true");

                // Open dashboard
                window.location.href = "admin.html";

            } else {

                error.style.display = "block";

            }

        });

    </script>

</body>
</html>
