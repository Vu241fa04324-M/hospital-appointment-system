<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Status</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f3f6fb;
            color: #172a3a;
        }

        .navbar {
            background: #172a3a;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
            font-size: 22px;
        }

        .navbar a {
            background: #4ecdc4;
            color: white;
            text-decoration: none;
            padding: 10px 16px;
            border-radius: 6px;
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin: 40px auto;
        }

        .search-box {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .search-box h2 {
            margin: 0 0 10px;
            color: #172a3a;
        }

        .search-box p {
            margin: 0 0 15px;
            color: #666;
        }

        .search-row {
            display: flex;
            gap: 10px;
        }

        .search-row input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .search-row button {
            padding: 12px 20px;
            font-size: 16px;
            background: #172a3a;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .search-row button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            display: none;
            margin-top: 15px;
            padding: 14px;
            border-radius: 6px;
        }

        #message.error {
            display: block;
            background: #ffe9e9;
            color: #c0392b;
        }

            display: none;
