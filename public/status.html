<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Appointment Status</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; font-family: Arial, sans-serif; background: #f3f6fb; color: #172a3a; }
.navbar { background: #172a3a; color: white; padding: 20px 30px; display: flex; justify-content: space-between; align-items: center; }
.navbar h2 { margin: 0; font-size: 22px; }
.navbar a { background: #4ecdc4; color: white; text-decoration: none; padding: 10px 16px; border-radius: 6px; }
.container { width: 90%; max-width: 800px; margin: 40px auto; }
.box { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.row-search { display: flex; gap: 10px; margin-top: 15px; }
.row-search input { flex: 1; padding: 12px; font-size: 16px; border: 1px solid #ccc; border-radius: 6px; }
.row-search button { padding: 12px 20px; font-size: 16px; background: #172a3a; color: white; border: none; border-radius: 6px; cursor: pointer; }
#message { display: none; margin-top: 15px; padding: 14px; border-radius: 6px; background: #ffe9e9; color: #c0392b; }
#result { display: none; margin-top: 20px; padding: 20px; border-radius: 8px; background: #f0faf0; border: 1px solid #cdeccd; }
.item { padding: 8px 0; border-bottom: 1px solid #dfeedf; }
.badge { padding: 4px 12px; border-radius: 20px; background: #fff3cd; color: #856404; font-weight: bold; }
</style>
</head>
<body>

<div class="navbar">
  <h2>🏥 Hospital Appointment</h2>
  <a href="/">Home</a>
</div>

<div class="container">
  <div class="box">

    <h2>Check Appointment Status</h2>
    <p>Enter your appointment ID to view the latest status.</p>
    <div class="row-search">
      <input type="text" id="appointmentId" placeholder="Enter appointment ID">
      <button id="checkBtn" type="button">Check Status</button>
    </div>
    <div id="message"></div>
    <div id="result"></div>
  </div>
</div>

<script>
const idInput = document.getElementById("appointmentId");
const btn = document.getElementById("checkBtn");
const message = document.getElementById("message");
const result = document.getElementById("result");

function showError(text) {
  result.style.display = "none";
  message.textContent = text;
  message.style.display = "block";
}

function addItem(label, value) {
  const div = document.createElement("div");
  div.className = "item";
  const b = document.createElement("strong");
  b.textContent = label + ": ";
  div.appendChild(b);
  if (label === "Status") {
    const badge = document.createElement("span");
    badge.className = "badge";

    badge.textContent = value;
    div.appendChild(badge);
  } else {
    div.appendChild(document.createTextNode(value));
  }
  result.appendChild(div);
}

function savedAppointment(id) {
  try { return JSON.parse(localStorage.getItem("appt_" + id)); }
  catch (e) { return null; }
}

async function checkStatus() {
  const id = idInput.value.trim();
  message.style.display = "none";
  result.style.display = "none";

  if (!id) { showError("Please enter your appointment ID."); return; }

  btn.disabled = true;
  btn.textContent = "Checking...";

  let data = null;

  // 1. Ask the server
  try {
    const response = await fetch("/api/appointments/" + encodeURIComponent(id));
    const json = await response.json();
    if (json.success && json.patientName) data = json;
  } catch (e) {}


  // 2. If the server forgot it, use the copy saved in this browser
  if (!data) data = savedAppointment(id);

  btn.disabled = false;
  btn.textContent = "Check Status";

  if (!data) {
    showError("Appointment not found. Please check your ID.");
    return;
  }

  result.innerHTML = "";
  addItem("Appointment ID", data.appointmentId);
  addItem("Status", data.status);
  addItem("Patient Name", data.patientName);
  addItem("Hospital", data.hospital);
  addItem("Specialist", data.specialist);
  addItem("Date", data.appointmentDate);
  addItem("Time Slot", data.timeSlot);
  result.style.display = "block";
}

btn.addEventListener("click", checkStatus);
idInput.addEventListener("keydown", function (e) {
  if (e.key === "Enter") checkStatus();
});
</script>

</body>
</html>
